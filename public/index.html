<!DOCTYPE html>
<html>
<head>
  <title>Rebel AI</title>
  <meta charset="utf-8" />
</head>
<body>
  <h1>Rebel AI</h1>
  <input id="q" placeholder="Ask something" />
  <button onclick="ask()">Ask</button>
  <pre id="out"></pre>

  <script>
    async function ask() {
      const q = document.getElementById("q").value;
      const r = await fetch("/api/ai/ask?q=" + encodeURIComponent(q));
      const j = await r.json();
      document.getElementById("out").innerText =
        j.reply || j.error || "No response";
    }
  </script>
</body>
</html>
